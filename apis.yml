name: Lumific
description: >-
  Lumific is a client reactivation platform for med spas that reconnects dormant
  clients with a practice to recover revenue from high-value treatments. Its
  proprietary system identifies inactive clients in an existing CRM (such as
  Mindbody or Zenoti) and launches automated, multi-channel outreach campaigns
  combining personalized text messaging, professional phone calls, and instant
  gift-card offers to drive bookings. Campaigns launch within 24 hours, pricing
  is performance-based (commission only on completed treatments), and the service
  is TCPA and HIPAA compliant with market exclusivity limited to a few clinics
  per area. Lumific was surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network. This provider currently publishes no public API,
  developer portal, or machine-readable API surface.
